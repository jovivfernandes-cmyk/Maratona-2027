<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14243c"><meta name="apple-mobile-web-app-capable" content="yes"><title>Treino • Maratona 2027</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-180.png"><meta name="apple-mobile-web-app-title" content="Maratona 2027"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="Diário de corrida, força, boxe e preparação para a Maratona 2027. Funciona offline após instalação."><style>
:root{--bg:#f2f5f9;--ink:#16253c;--muted:#586a80;--line:#dce4ee;--accent:#176a83;--soft:#e9f4f6;--green:#21704c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}header{background:linear-gradient(125deg,#14243c,#245b72);color:white;padding:24px 18px 22px}header small{letter-spacing:.13em;text-transform:uppercase;opacity:.8}h1{font-size:24px;margin:9px 0}header p{margin:0;color:#d7e8f1;font-size:13px}.wrap{max-width:860px;margin:auto;padding:15px}.tabs{position:sticky;top:0;background:#fff;z-index:5;display:flex;overflow-x:auto;gap:4px;padding:9px;border-bottom:1px solid var(--line)}button{cursor:pointer;font:inherit}.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);border-radius:10px;padding:10px 13px;font-weight:700}.tab.active{background:var(--ink);color:white}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 2px 8px #192d4510}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:12px 0 8px}.muted,.hint{color:var(--muted);font-size:13px;line-height:1.5}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{background:#edf3f8;border-radius:12px;padding:12px}.metric strong{display:block;font-size:22px}.metric span{font-size:12px;color:var(--muted)}label{display:block;font-size:12px;font-weight:750;color:#41556b;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #b8c7d5;border-radius:10px;padding:11px;font:inherit;color:var(--ink);background:white;min-width:0}textarea{min-height:72px}.btn{border:0;border-radius:11px;background:var(--accent);color:white;padding:12px 15px;font-weight:750;min-height:44px}.btn.secondary{background:#e7eef5;color:var(--ink)}.btn.warn{background:#fbe9e7;color:#8c2c20}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pill{display:inline-block;border-radius:100px;background:var(--soft);color:#176179;font-size:11px;font-weight:800;padding:5px 9px}.item{border-top:1px solid var(--line);padding:11px 0}.item:first-of-type{border-top:0}.exercise{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:start}.exercise input[type=checkbox]{width:21px;height:21px;margin:3px 0;accent-color:var(--green)}.exercise strong{display:block;font-size:14px}.exercise small{color:var(--muted)}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.fields input{padding:8px}.bar{height:9px;background:#e6edf4;border-radius:99px;overflow:hidden;margin:10px 0}.bar>div{height:100%;background:var(--green)}svg{max-width:100%;height:auto}.schedule{display:grid;grid-template-columns:64px 1fr;gap:10px;border-top:1px solid var(--line);padding:10px 0}.schedule b{font-size:12px}.schedule span{font-size:13px}.alert{border-left:3px solid #c68a32;padding:9px 12px;background:#fff7e8;border-radius:7px;font-size:13px}.mini{font-size:11px;color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding:24px}.fields{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><header><small>Plano atlético • offline</small><h1>Maratona 2027 + Full Body</h1><p>Meta sub 4h · 25/07/2027 · Corrida, força e boxe · PSE 1–5</p></header><nav class="tabs" id="tabs"></nav><main class="wrap" id="root"></main><script>
(()=>{'use strict';const KEY='maratona2027_v2',START='2026-10-19',RACE='2027-07-25',names=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];const gym={
seg:{name:'Full body A · força geral',duration:'40–45 min',ex:[['Agachamento livre','3×6','2 min'],['Supino com halteres','3×8','90 s'],['Remada baixa','3×8','90 s'],['Panturrilha em pé','2×12','60 s'],['Rosca direta','2×10','45–60 s'],['Tríceps na corda','2×10','45–60 s'],['Prancha frontal','2×40 s','30 s'],['Dead bug','2×10/lado','30 s']]},
qua:{name:'Full body B · posterior e estabilidade',duration:'40–45 min',ex:[['Terra romeno','3×6','2 min'],['Puxada alta ou barra fixa','3×8','90 s'],['Afundo reverso','2×8/perna','90 s'],['Desenvolvimento com halteres','2×8','75 s'],['Rosca martelo','2×10','45–60 s'],['Tríceps acima da cabeça','2×10','45–60 s'],['Pallof press','2×10/lado','30 s'],['Prancha lateral','2×30 s/lado','30 s']]},
sex:{name:'Full body C · manutenção funcional',duration:'35–45 min',ex:[['Step-up com halteres','2×8/perna','75 s'],['Supino inclinado','3×8','90 s'],['Remada unilateral','3×8/lado','75 s'],['Elevação lateral','2×12','45 s'],['Rosca alternada','2×10','45–60 s'],['Tríceps francês','2×10','45–60 s'],["Farmer's walk",'3×30 m','60 s'],['Reverse crunch','2×12','30 s']]}};
const phases=[{a:1,b:4,n:'Retomada',range:'14–22 km',note:'Predomínio de PSE 2; acelerações breves opcionais; consolidar frequência.'},{a:5,b:12,n:'Base aeróbica',range:'20–35 km',note:'Fartlek leve e intervalos aeróbicos apenas após adaptação.'},{a:13,b:20,n:'Resistência',range:'30–45 km',note:'Rodagens, limiar controlado e longões progressivos.'},{a:21,b:36,n:'Específica de maratona',range:'40–60 km',note:'Aumentar especificidade, avaliar quarta corrida e nutrição em longões.'},{a:37,b:40,n:'Polimento',range:'Redução individual',note:'Reduzir volume, preservar estímulos breves e priorizar recuperação.'}];
const plan={1:[4,4,6],2:[4,5,7],3:[5,5,8],4:[4,4,6]};const base={version:2,active:'hoje',logs:{},feedback:{},weekOverrides:{},settings:{}};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(base)}catch(e){state=JSON.parse(JSON.stringify(base))}state.logs||={};state.feedback||={};state.weekOverrides||={};state.customWeeks||={};const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>{let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};const date=s=>new Date(s+'T12:00:00');const plus=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return iso(d)};const fmt=s=>date(s).toLocaleDateString('pt-BR');const today=iso(new Date());const weekOf=s=>Math.max(1,Math.floor((date(s)-date(START))/604800000)+1);const weekStart=w=>plus(START,(w-1)*7);const weekNow=Math.min(40,Math.max(1,weekOf(today)));const phase=w=>phases.find(p=>w>=p.a&&w<=p.b)||phases.at(-1);const getLog=(d,type)=>state.logs[d+'_'+type]||{};const setLog=(d,type,v)=>{state.logs[d+'_'+type]={...getLog(d,type),...v};save()};function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Armazenamento indisponível. Exporte um backup para preservar seus dados.')}}function btn(label,fn,cls=''){return `<button class="btn ${cls}" data-action="${fn}">${label}</button>`}function render(){const tabs=[['hoje','Hoje'],['semana','Semana'],['forca','Força'],['corrida','Corrida'],['feedback','Feedback'],['evolucao','Evolução'],['editor','Editar plano'],['backup','Backup']];$('tabs').innerHTML=tabs.map(([id,n])=>`<button class="tab ${state.active===id?'active':''}" data-tab="${id}">${n}</button>`).join('');$('root').innerHTML=({hoje:home,semana:weekly,forca:strength,corrida:running,feedback:feedback,evolucao:progress,editor:editor,backup:backup})[state.active]();document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{state.active=x.dataset.tab;save();render()});bind()}
function weekRuns(w){let c=state.customWeeks?.[w];if(c){return [1,3,6].map(i=>Number(c.days?.[i]?.km)||0)}return state.weekOverrides[w]||plan[w]||null}function getGym(d,t){let w=weekOf(d),day=(date(d).getDay()+6)%7;let c=state.customWeeks?.[w]?.days?.[day];return c?.gym?.ex?c.gym:gym[t]}function getDay(d){let w=weekOf(d),day=(date(d).getDay()+6)%7;return state.customWeeks?.[w]?.days?.[day]||null}function home(){let d=new Date().getDay(),type={1:'seg',3:'qua',5:'sex'}[d];return `<section class="card"><div class="row"><h2>Seu plano hoje</h2><span class="pill">${fmt(today)}</span></div><p class="muted">${names[d]} · Semana ${weekNow}/40 · ${phase(weekNow).n}</p>${type?`<h3>${getGym(today,type).name}</h3><p class="muted">Musculação até 45 min; boxe ${d===5?'opcional':'técnico conforme recuperação'}.</p>${btn('Registrar musculação','goStrength')}`:d===2||d===4||d===0?`<h3>${d===0?'Longão':d===2?'Rodagem':'Estímulo variável'}</h3><p class="muted">Confira o treino da semana e registre distância, tempo e PSE.</p>${btn('Abrir corrida','goRun')}`:'<p>Descanso ou recuperação ativa opcional.</p>'}</section><section class="card"><h2>Meta de prova</h2><div class="grid"><div class="metric"><strong>42,195</strong><span>km na maratona</span></div><div class="metric"><strong>5:41</strong><span>min/km para 4h</span></div><div class="metric"><strong>3×</strong><span>full body/semana</span></div><div class="metric"><strong>2×</strong><span>boxe prioritário</span></div></div><p class="hint">Meia maratona recente: 2h perto do limite. Volume inicial declarado: 0 km/semana. Progressão condicionada à recuperação.</p></section>${weekly(true)}`}
function weekly(compact=false){let w=weekNow,ws=weekStart(w),r=weekRuns(w),days=[['Seg','Full body A + boxe técnico'],['Ter','Rodagem leve'],['Qua','Full body B + boxe técnico'],['Qui','Rodagem / estímulo controlado'],['Sex','Full body C; boxe opcional'],['Sáb','Descanso'],['Dom','Longão fácil']];return `<section class="card"><div class="row"><h2>Semana ${w} · ${phase(w).n}</h2><span class="pill">${fmt(ws)}–${fmt(plus(ws,6))}</span></div><p class="muted">${phase(w).note}</p>${r?`<div class="grid"><div class="metric"><strong>${r.reduce((a,b)=>a+b,0)} km</strong><span>Volume sugerido</span></div><div class="metric"><strong>${r[2]} km</strong><span>Longão sugerido</span></div></div>`:`<div class="alert">Volume desta semana ainda não foi prescrito. Use o feedback anterior para definir a próxima semana; as faixas de fase não são metas automáticas.</div>`}${days.map((x,i)=>`<div class="schedule"><b>${x[0]}<br>${fmt(plus(ws,i))}</b><span>${escape(state.customWeeks?.[w]?.days?.[i]?.title||x[1])}${state.customWeeks?.[w]?.days?.[i]?.run?.details?' · '+escape(state.customWeeks[w].days[i].run.details):''}${r&&[1,3,6].includes(i)?` · <b>${r[i===1?0:i===3?1:2]} km</b> · PSE 2`:''}</span></div>`).join('')}${compact?'':`<p class="hint">Semana 1: terça 4 km PSE 2; quinta 4 km com 4 × 15 s de acelerações controladas, se recuperado; domingo 6 km PSE 2. As semanas 2–4 são apenas sugestões e podem ser alteradas.</p>`}</section>${compact?'':`<section class="card"><h2>Periodização até a prova</h2>${phases.map(p=>`<div class="item"><b>Semanas ${p.a}–${p.b}: ${p.n}</b><br><span class="pill">${p.range}</span><p class="muted">${p.note}</p></div>`).join('')}<p class="hint">A prova é em 25/07/2027. O polimento e o volume final dependem do ciclo efetivamente cumprido.</p></section>`}`}
function strength(){return `<section class="card"><h2>Musculação full body</h2><p class="muted">Segunda, quarta e sexta · 35–45 min · 2–3 repetições em reserva. Use superséries de bíceps/tríceps e respeite descansos dos compostos.</p><label>Data do treino</label><input type="date" id="gymDate" value="${state.gymDate||today}"><label>Selecione o treino</label><select id="gymType">${Object.entries(gym).map(([k,v])=>`<option value="${k}" ${k===(state.gymType||'seg')?'selected':''}>${v.name}</option>`).join('')}</select></section><div id="gymContent"></div>`}
function gymContent(){let d=$('gymDate').value,t=$('gymType').value;state.gymDate=d;state.gymType=t;save();let log=getLog(d,'gym_'+t),g=getGym(d,t),checks=log.checks||{},count=Object.values(checks).filter(Boolean).length; $('gymContent').innerHTML=`<section class="card"><div class="row"><h2>${g.name}</h2><span class="pill">${g.duration}</span></div><div class="bar"><div style="width:${count/g.ex.length*100}%"></div></div><p class="mini">${count}/${g.ex.length} exercícios marcados</p>${g.ex.map((e,i)=>`<div class="item exercise"><input type="checkbox" data-ex="${i}" ${checks[i]?'checked':''}><div><strong>${escape(e[0])}</strong><small>${e[1]} · descanso ${e[2]}</small><div class="fields"><div><label>Carga (kg)</label><input data-load="${i}" type="text" inputmode="decimal" placeholder="Ex.: 20" value="${escape((log.loads||{})[i]||'')}"></div><div><label>Repetições reais</label><input data-reps="${i}" placeholder="Ex.: 8/8/8" value="${escape((log.reps||{})[i]||'')}"></div></div></div></div>`).join('')}<label>PSE geral do treino (1–5)</label><select id="gymPse">${[1,2,3,4,5].map(n=>`<option ${Number(log.pse||2)===n?'selected':''}>${n}</option>`).join('')}</select><label>Observações</label><textarea id="gymNote">${escape(log.note||'')}</textarea><div class="actions">${btn('Salvar sessão','saveGym')}</div></section>`;document.querySelectorAll('[data-ex]').forEach(el=>el.onchange=()=>{let a=getLog(d,'gym_'+t),c={...(a.checks||{})};c[el.dataset.ex]=el.checked;setLog(d,'gym_'+t,{checks:c});gymContent()})}
function running(){return `<section class="card"><h2>Registro de corrida</h2><p class="muted">PSE 1 recuperação · 2 leve · 3 moderado · 4 forte · 5 máximo. Registre o esforço real, não o desejado.</p><label>Data</label><input id="runDate" type="date" value="${state.runDate||today}"><div id="runForm"></div></section>`}function runContent(){let d=$('runDate').value;state.runDate=d;save();let l=getLog(d,'run'),prescribed=getDay(d),w=weekOf(d),r=weekRuns(w),dow=date(d).getDay(),suggest=r?dow===2?r[0]:dow===4?r[1]:dow===0?r[2]:null:null;$('runForm').innerHTML=`${prescribed?.run?`<div class="alert"><b>Prescrição do dia:</b> ${escape(prescribed.title||'Corrida')} · ${escape(prescribed.run.details||'')} · PSE ${escape(prescribed.run.pse||2)}</div>`:''}<div class="grid"><div><label>Tipo de treino</label><select id="runType">${['Rodagem','Longão','Acelerações','Fartlek','Intervalado','Limiar','Ritmo maratona','Recuperação','Outro'].map(t=>`<option ${(l.type||prescribed?.run?.type)===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Distância (km)</label><input id="runKm" type="number" min="0" step="0.01" value="${escape(l.km??'')}"></div><div><label>Tempo (minutos)</label><input id="runMin" type="number" min="0" step="0.1" value="${escape(l.minutes??'')}"></div><div><label>PSE 1–5</label><select id="runPse">${[1,2,3,4,5].map(n=>`<option ${Number(l.pse||2)===n?'selected':''}>${n}</option>`).join('')}</select></div></div><p class="hint">${suggest!==null?'Planejado para este dia: '+suggest+' km.':'Sem distância específica cadastrada para este dia.'}</p><label>Ritmo / frequência cardíaca / terreno / sensações</label><textarea id="runNote">${escape(l.note||'')}</textarea><div class="actions">${btn('Salvar corrida','saveRun')}</div>`}
function feedback(){let w=Number(state.fbWeek||weekNow),f=state.feedback[w]||{};return `<section class="card"><h2>Feedback semanal</h2><label>Semana a avaliar</label><select id="fbWeek">${Array.from({length:40},(_,i)=>i+1).map(n=>`<option value="${n}" ${w===n?'selected':''}>Semana ${n} · ${fmt(weekStart(n))}</option>`).join('')}</select><div id="fbContent"></div></section>`}function fbContent(){let w=Number($('fbWeek').value);state.fbWeek=w;save();let f=state.feedback[w]||{},sum=weekStats(w);$('fbContent').innerHTML=`<p class="muted">Registrado nesta semana: <b>${sum.km.toFixed(1)} km</b> em ${sum.runs} corridas; ${sum.gym} sessões de força. Confira o total e complemente os dados abaixo.</p><div class="grid"><div><label>Boxe realizado (aulas)</label><select id="fbBox">${[0,1,2,3].map(n=>`<option ${Number(f.box||0)===n?'selected':''}>${n}</option>`).join('')}</select></div><div><label>Intensidade do boxe (PSE)</label><select id="fbBoxPse">${[1,2,3,4,5].map(n=>`<option ${Number(f.boxPse||2)===n?'selected':''}>${n}</option>`).join('')}</select></div><div><label>Sono / recuperação</label><select id="fbRecovery">${['Boa','Regular','Ruim'].map(x=>`<option ${f.recovery===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Dor / desconforto</label><select id="fbPain">${['Nenhuma','Leve passageira','Persistente ou crescente'].map(x=>`<option ${f.pain===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Fadiga geral (PSE 1–5)</label><select id="fbFatigue">${[1,2,3,4,5].map(n=>`<option ${Number(f.fatigue||2)===n?'selected':''}>${n}</option>`).join('')}</select></div><div><label>Longão realizado (km)</label><input id="fbLong" type="number" min="0" step="0.1" value="${escape(f.long??sum.long??'')}"></div></div><label>Observações, treinos perdidos, cargas, ritmos</label><textarea id="fbNotes">${escape(f.notes||'')}</textarea><div class="actions">${btn('Salvar feedback','saveFeedback')}${btn('Copiar relatório para análise','copyReport','secondary')}</div><div class="alert" style="margin-top:12px">O aplicativo não prescreve automaticamente aumentos de carga. Após a análise semanal, registre abaixo os quilômetros aprovados para a semana seguinte.</div><h3>Planejamento revisado da semana seguinte</h3><div class="grid"><div><label>Terça (km)</label><input id="nextTue" type="number" min="0" step="0.5"></div><div><label>Quinta (km)</label><input id="nextThu" type="number" min="0" step="0.5"></div><div><label>Domingo (km)</label><input id="nextSun" type="number" min="0" step="0.5"></div></div><div class="actions">${btn('Aplicar distâncias aprovadas','setNext')}</div>`;let next=weekRuns(w+1);if(next){$('nextTue').value=next[0];$('nextThu').value=next[1];$('nextSun').value=next[2]}}
function weekStats(w){let ws=weekStart(w),km=0,runs=0,g=0,long=0;for(let i=0;i<7;i++){let d=plus(ws,i),r=getLog(d,'run');if(r.km!==undefined&&r.km!==''&&Number.isFinite(Number(r.km))){km+=Number(r.km);runs++;long=Math.max(long,Number(r.km))}for(let k of Object.keys(gym)){let l=getLog(d,'gym_'+k);if(l.saved)g++}}return{km,runs,gym:g,long}}
function progress(){let rows=Array.from({length:40},(_,i)=>{let w=i+1,s=weekStats(w);return{w,...s}}),recorded=rows.filter(x=>x.runs||x.gym),max=Math.max(20,...recorded.map(x=>x.km));let chart=recorded.length?`<svg viewBox="0 0 680 230" role="img" aria-label="Gráfico de quilômetros semanais"><line x1="42" y1="195" x2="655" y2="195" stroke="#98aabd"/><line x1="42" y1="20" x2="42" y2="195" stroke="#98aabd"/>${recorded.map((r,i)=>{let x=50+(r.w-1)/39*595,y=195-r.km/max*165;return `<circle cx="${x}" cy="${y}" r="4" fill="#176a83"><title>Semana ${r.w}: ${r.km.toFixed(1)} km</title></circle>`}).join('')}<polyline fill="none" stroke="#176a83" stroke-width="2.5" points="${recorded.map(r=>`${50+(r.w-1)/39*595},${195-r.km/max*165}`).join(' ')}"/><text x="12" y="24" font-size="12" fill="#536073">${max.toFixed(0)} km</text><text x="42" y="216" font-size="12" fill="#536073">S1</text><text x="615" y="216" font-size="12" fill="#536073">S40</text></svg>`:'<p class="muted">Registre a primeira corrida para visualizar o gráfico.</p>';return `<section class="card"><h2>Evolução da quilometragem</h2>${chart}</section><section class="card"><h2>Histórico semanal</h2>${recorded.length?recorded.map(x=>`<div class="schedule"><b>Semana ${x.w}</b><span>${x.km.toFixed(1)} km · ${x.runs} corridas · maior sessão ${x.long.toFixed(1)} km · ${x.gym} forças</span></div>`).join(''):'<p class="muted">Sem registros concluídos.</p>'}</section>`}
function backup(){return `<section class="card"><h2>Instalação e uso offline</h2><p class="muted">No iPhone, abra o endereço HTTPS no Safari, toque em Compartilhar → Adicionar à Tela de Início e selecione Abrir como App (se aparecer). Abra uma vez com internet para guardar o aplicativo no aparelho.</p><p id="networkState" class="pill">${navigator.onLine?"Conexão disponível · aplicativo preparado para offline":"Você está offline"}</p><p class="hint">O histórico é salvo neste navegador. Não há sincronização entre dispositivos. Exporte o backup JSON semanalmente e antes de trocar de aparelho, limpar dados ou reinstalar.</p></section><section class="card"><h2>Backup e recuperação</h2><p class="muted">Seus registros ficam neste navegador/dispositivo. Não há sincronização automática. Faça backup regularmente, especialmente antes de trocar de celular, limpar dados do Safari ou atualizar o arquivo.</p><div class="actions">${btn('Exportar backup JSON','export')}${btn('Exportar histórico CSV','csv','secondary')}</div><label>Importar backup JSON</label><input type="file" id="importFile" accept=".json,application/json"><div class="actions">${btn('Importar backup','import','secondary')}</div><p class="hint">A importação substitui os registros desta versão. Exporte uma cópia antes de importar. O arquivo HTML funciona sem conexão e sem bibliotecas externas; o Safari pode restringir armazenamento quando aberto diretamente como arquivo.</p></section><section class="card"><h2>Estratégia preservada</h2><p class="muted">Meta sub 4h em 25/07/2027; meia maratona recente em 2h perto do limite; corrida terça/quinta/domingo; full body segunda/quarta/sexta até 45 min; boxe segunda e quarta, sexta opcional; PSE 1–5; progressão individual com feedback.</p></section>`}
function bind(){if(state.active==='forca'){$('gymDate').onchange=gymContent;$('gymType').onchange=gymContent;gymContent()}if(state.active==='corrida'){$('runDate').onchange=runContent;runContent()}if(state.active==='feedback'){$('fbWeek').onchange=fbContent;fbContent()}if(state.active==='editor'){bindEditor()}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=actions[b.dataset.action])}
const actions={goStrength(){state.active='forca';render()},goRun(){state.active='corrida';render()},saveGym(){let d=$('gymDate').value,t=$('gymType').value,loads={},reps={};document.querySelectorAll('[data-load]').forEach(e=>loads[e.dataset.load]=e.value);document.querySelectorAll('[data-reps]').forEach(e=>reps[e.dataset.reps]=e.value);setLog(d,'gym_'+t,{loads,reps,pse:Number($('gymPse').value),note:$('gymNote').value,saved:true,exerciseSnapshot:JSON.parse(JSON.stringify(getGym(d,t).ex))});alert('Musculação salva.')},saveRun(){let km=$('runKm').value,minutes=$('runMin').value;if(km===''||Number(km)<0||minutes===''||Number(minutes)<0){alert('Informe distância e tempo válidos.');return}setLog($('runDate').value,'run',{type:$('runType').value,km:Number(km),minutes:Number(minutes),pse:Number($('runPse').value),note:$('runNote').value});alert('Corrida salva.')},saveFeedback(){let w=Number($('fbWeek').value);state.feedback[w]={box:Number($('fbBox').value),boxPse:Number($('fbBoxPse').value),recovery:$('fbRecovery').value,pain:$('fbPain').value,fatigue:Number($('fbFatigue').value),long:$('fbLong').value,notes:$('fbNotes').value};save();alert('Feedback salvo.')},copyReport(){actions.saveFeedback();let w=Number($('fbWeek').value),f=state.feedback[w],s=weekStats(w),r=weekRuns(w);let msg=`Maratona 25/07/2027, meta sub 4h. Semana ${w} (${fmt(weekStart(w))}): planejado ${r?r.join('+')+' km':'sem volume fechado'}; realizado ${s.km.toFixed(1)} km em ${s.runs} corridas, maior sessão ${s.long.toFixed(1)} km; musculação ${s.gym} sessões; boxe ${f.box} aulas PSE ${f.boxPse}/5; fadiga ${f.fatigue}/5; sono/recuperação ${f.recovery}; dor ${f.pain}; observações ${f.notes||'nenhuma'}. Analise o progresso e prescreva a próxima semana com rodagem, estímulo e longão, considerando força seg/qua/sex e boxe pelo menos 2x.`;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(msg).then(()=>alert('Relatório copiado. Cole no ChatGPT.')).catch(()=>prompt('Copie o relatório:',msg))}else prompt('Copie o relatório:',msg)},setNext(){let w=Number($('fbWeek').value)+1;if(w>40){alert('Não há próxima semana dentro deste ciclo.');return}let vals=['nextTue','nextThu','nextSun'].map(x=>Number($(x).value));if(vals.some(v=>!Number.isFinite(v)||v<0)||['nextTue','nextThu','nextSun'].some(x=>$(x).value==='')){alert('Informe três distâncias válidas.');return}state.weekOverrides[w]=vals;save();alert('Semana '+w+' atualizada.')},export(){download('backup_treino_maratona_2027_'+today+'.json',JSON.stringify({app:'maratona2027',exported:today,data:state},null,2),'application/json')},csv(){let out=['data,tipo,distancia_km,tempo_min,pse,observacoes'];Object.entries(state.logs).forEach(([key,v])=>{let d=key.slice(0,10),type=key.slice(11);let cols=[d,type,v.km??'',v.minutes??'',v.pse??'',v.note??''];out.push(cols.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(','))});download('historico_treino_2027.csv','\ufeff'+out.join('\r\n'),'text/csv;charset=utf-8')},import(){let f=$('importFile').files[0];if(!f){alert('Selecione um arquivo JSON.');return}let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(obj.app!=='maratona2027'||!obj.data||typeof obj.data.logs!=='object'||!obj.data.feedback)throw Error('Arquivo incompatível');if(!confirm('Substituir todos os dados atuais pelos dados do backup?'))return;state=obj.data;state.customWeeks||={};save();render();alert('Backup restaurado.')}catch(e){alert('Não foi possível importar: '+e.message)}};reader.readAsText(f)}};function download(name,data,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:mime}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function blankDay(i){let t={0:'Full body A + boxe',1:'Rodagem',2:'Full body B + boxe',3:'Corrida',4:'Full body C + boxe opcional',5:'Descanso',6:'Longão'};let type={0:'seg',2:'qua',4:'sex'}[i];return {title:t[i],km:[null,4,null,4,null,null,6][i],run:[1,3,6].includes(i)?{type:i===6?'Longão':'Rodagem',pse:2,details:''}:null,gym:type?JSON.parse(JSON.stringify(gym[type])):null,boxe:i===0||i===2?'Técnico / moderado':i===4?'Opcional':''}}
function getWeekCopy(w){let saved=state.customWeeks?.[w];if(saved)return JSON.parse(JSON.stringify(saved));let r=weekRuns(w)||[0,0,0];let days=Array.from({length:7},(_,i)=>blankDay(i));[1,3,6].forEach((d,i)=>days[d].km=r[i]);if(w===1)days[3].run.details='4 km totais incluindo 4 × 15 segundos de acelerações progressivas, com recuperação completa';return {week:w,start:weekStart(w),days}}
let editWeek=null,editDay=0;
function editor(){let w=Number(state.editWeek||weekNow),p=getWeekCopy(w);return `<section class="card"><h2>Editar / importar prescrição</h2><p class="muted">Edite uma semana específica ou importe o JSON preparado após o feedback. As alterações ficam neste aparelho, sem atualizar o GitHub. Faça backup antes de grandes mudanças.</p><label>Semana</label><select id="edWeek">${Array.from({length:40},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===w?'selected':''}>Semana ${n} · ${fmt(weekStart(n))}</option>`).join('')}</select><label>Dia da semana</label><select id="edDay">${['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'].map((n,i)=>`<option value="${i}" ${i===editDay?'selected':''}>${n}</option>`).join('')}</select><div id="edFields"></div></section><section class="card"><h2>Importar prescrição semanal</h2><p class="muted">Aceita apenas JSON de dados, não executa scripts. Antes de aplicar, apresenta a prévia e solicita confirmação. A importação substitui a prescrição daquela semana, não os treinos registrados.</p><input type="file" id="prescriptionFile" accept=".json,application/json"><div class="actions">${btn('Conferir e importar','importPrescription','secondary')}${btn('Exportar prescrição da semana','exportPrescription','secondary')}</div><p class="hint">Formato: app = maratona2027-prescricao; schema = 1; week = 1 a 40; days = sete dias, de segunda a domingo. Utilize a exportação como modelo.</p></section>`}
function bindEditor(){$('edWeek').onchange=()=>{state.editWeek=Number($('edWeek').value);editDay=0;save();render()};$('edDay').onchange=()=>{editDay=Number($('edDay').value);edFields()};edFields()}
function edFields(){let w=Number($('edWeek').value),d=editDay,c=getWeekCopy(w).days[d];$('edFields').innerHTML=`<label>Título da sessão</label><input id="edTitle" value="${escape(c.title)}"><label>Orientação de boxe / recuperação</label><textarea id="edBox">${escape(c.boxe||'')}</textarea><label>Corrida (tipo)</label><select id="edRunType"><option value="">Sem corrida</option>${['Rodagem','Longão','Acelerações','Fartlek','Intervalado','Limiar','Ritmo maratona','Recuperação','Outro'].map(t=>`<option ${c.run?.type===t?'selected':''}>${t}</option>`).join('')}</select><div class="grid"><div><label>Distância planejada (km)</label><input id="edKm" type="number" min="0" step="0.1" value="${c.km??''}"></div><div><label>PSE alvo (1–5)</label><select id="edPse">${[1,2,3,4,5].map(n=>`<option ${Number(c.run?.pse||2)===n?'selected':''}>${n}</option>`).join('')}</select></div></div><label>Detalhes de corrida: aquecimento, blocos, recuperação, desaquecimento</label><textarea id="edRunDetails">${escape(c.run?.details||'')}</textarea><label>Musculação: nome</label><input id="edGymName" value="${escape(c.gym?.name||'')}"><label>Musculação: duração</label><input id="edGymDuration" value="${escape(c.gym?.duration||'')}"><label>Exercícios — uma linha por exercício: nome | séries × repetições | descanso</label><textarea id="edExercises" style="min-height:200px">${escape((c.gym?.ex||[]).map(x=>x.join(' | ')).join('\n'))}</textarea><p class="hint">Exemplo: Agachamento livre | 3×6 | 120 s. Para dia sem musculação, deixe nome e exercícios vazios. Evite alterar a prescrição de sessões já realizadas.</p><div class="actions">${btn('Salvar este dia','saveEditedDay')}${btn('Restaurar semana original','resetEditedWeek','secondary')}</div>`;document.querySelectorAll('#edFields [data-action]').forEach(b=>b.onclick=actions[b.dataset.action])}
function validPrescription(obj){if(!obj||obj.app!=='maratona2027-prescricao'||obj.schema!==1||!Number.isInteger(obj.week)||obj.week<1||obj.week>40||obj.start!==weekStart(obj.week)||!Array.isArray(obj.days)||obj.days.length!==7)throw Error('Estrutura, semana ou datas inválidas.');let days=obj.days.map((d,i)=>{if(!d||typeof d.title!=='string'||d.title.length>160)throw Error('Título inválido no dia '+(i+1));let km=d.km==null?null:Number(d.km);if(km!==null&&(!Number.isFinite(km)||km<0||km>100))throw Error('Distância inválida no dia '+(i+1));let run=null;if(d.run){if(typeof d.run.type!=='string'||d.run.type.length>80||typeof d.run.details!=='string'||d.run.details.length>3000||!Number.isInteger(Number(d.run.pse))||Number(d.run.pse)<1||Number(d.run.pse)>5)throw Error('Corrida inválida no dia '+(i+1));run={type:d.run.type,pse:Number(d.run.pse),details:d.run.details}}let gymData=null;if(d.gym){if(typeof d.gym.name!=='string'||d.gym.name.length>120||typeof d.gym.duration!=='string'||d.gym.duration.length>60||!Array.isArray(d.gym.ex)||d.gym.ex.length>25)throw Error('Musculação inválida no dia '+(i+1));let ex=d.gym.ex.map(e=>{if(!Array.isArray(e)||e.length<3||e.slice(0,3).some(x=>typeof x!=='string'||x.length>200))throw Error('Exercício inválido no dia '+(i+1));return e.slice(0,3)});gymData={name:d.gym.name,duration:d.gym.duration,ex}}return{title:d.title,boxe:String(d.boxe||'').slice(0,500),km,run,gym:gymData}});return{week:obj.week,start:obj.start,days}}
function hasWeekLogs(w){let start=weekStart(w);return Object.keys(state.logs).some(k=>k.slice(0,10)>=start&&k.slice(0,10)<=plus(start,6))}
function savePrescription(p){state.customWeeks||={};state.customWeeks[p.week]=p;save()}
function readPrescription(f){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>{try{resolve(JSON.parse(reader.result))}catch(e){reject(e)}};reader.onerror=()=>reject(Error('Falha ao ler arquivo'));reader.readAsText(f)})}
function editDaySave(){let w=Number($('edWeek').value),p=getWeekCopy(w),title=$('edTitle').value.trim(),type=$('edRunType').value,km=$('edKm').value,exText=$('edExercises').value.trim(),name=$('edGymName').value.trim();if(!title){alert('Informe o título.');return}let ex=exText?exText.split('\n').map(line=>line.split('|').map(x=>x.trim())):[];if(ex.some(x=>x.length!==3||x.some(v=>!v))){alert('Use três campos por exercício, separados por |.');return}p.days[editDay]={title,boxe:$('edBox').value,km:km===''?null:Number(km),run:type?{type,pse:Number($('edPse').value),details:$('edRunDetails').value}:null,gym:name?{name,duration:$('edGymDuration').value,ex}:null};try{p=validPrescription({app:'maratona2027-prescricao',schema:1,...p});if(hasWeekLogs(w)&&!confirm('Há treinos registrados nesta semana. A nova prescrição não apaga os registros, mas pode alterar a lista de exercícios exibida. Continuar?'))return;savePrescription(p);alert('Treino atualizado para a semana '+w+'.');edFields()}catch(e){alert(e.message)}}
actions.saveEditedDay=editDaySave;
actions.resetEditedWeek=()=>{let w=Number($('edWeek').value);if(!confirm('Remover a prescrição personalizada da semana '+w+'? Registros de treino serão mantidos.'))return;delete state.customWeeks[w];save();render()};
actions.exportPrescription=()=>{let w=Number($('edWeek').value);download('prescricao_semana_'+String(w).padStart(2,'0')+'.json',JSON.stringify({app:'maratona2027-prescricao',schema:1,...getWeekCopy(w)},null,2),'application/json')};
actions.importPrescription=async()=>{let f=$('prescriptionFile')?.files?.[0];if(!f){alert('Selecione o arquivo de prescrição JSON.');return}try{if(f.size>200000)throw Error('Arquivo excede 200 KB');let p=validPrescription(await readPrescription(f)),total=p.days.reduce((a,d)=>a+(d.km||0),0);let summary=p.days.map((d,i)=>['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]+': '+d.title+(d.km!=null?' ('+d.km+' km)':'')+(d.gym?' · '+d.gym.ex.length+' exercícios':'')).join('\n');if(!confirm('IMPORTAR SEMANA '+p.week+' ('+fmt(p.start)+')\nTotal de corrida: '+total+' km\n\n'+summary+'\n\nSubstituir apenas a prescrição desta semana?'+(hasWeekLogs(p.week)?'\nATENÇÃO: há sessões registradas nesta semana.':'')))return;savePrescription(p);state.editWeek=p.week;save();render();alert('Prescrição importada. Confira os treinos em Semana, Força e Corrida.')}catch(e){alert('Importação cancelada: '+e.message)}};

render();})();
</script><script>
